<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The brand mark: the S of "Sakasu's note." on the site's night sky, with
       the same blue-to-cyan gradient the dot after the name wears. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0e17"/>
  <text x="30" y="45" text-anchor="middle" font-family="'Space Grotesk','Inter',ui-sans-serif,system-ui,sans-serif" font-weight="700" font-size="38" fill="#f8fafc">S</text>
  <circle cx="48" cy="42" r="5" fill="url(#g)"/>
</svg>
